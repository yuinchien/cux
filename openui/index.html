<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>&lt;select&gt;</title>
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,1,0"
        />
        <link rel="stylesheet" href="styles.css" />
    </head>

    <body>
        <template id="template">
            <select class="my-custom-select">
                <button type="button">
                    <selectedcontent></selectedcontent>
                </button>
                <option>50%</option>
                <option selected>100%</option>
                <option>200%</option>
            </select>
            <select class="my-custom-select">
                <button type="button">
                    <selectedcontent></selectedcontent>
                </button>
                <option selected>Normal Text</option>
                <option>Title</option>
                <option>Subtitle</option>
                <option>Heading 1</option>
                <option>Heading 2</option>
                <option>Heading 3</option>
            </select>
            <select class="my-custom-select">
                <button type="button">
                    <selectedcontent></selectedcontent>
                </button>
                <option disabled>
                    <span class="material-symbols-outlined">
                        language_french </span
                    >French
                </option>
                <option selected>
                    <span class="material-symbols-outlined">
                        language_spanish </span
                    >Spanish
                </option>
                <option>
                    <span class="material-symbols-outlined">
                        language_gb_english </span
                    >British English
                </option>
            </select>
            <select class="my-custom-select">
                <button type="button">
                    <selectedcontent></selectedcontent>
                </button>
                <option>
                    <span class="material-symbols-outlined"> face_5 </span
                    >Michael Harris
                </option>
                <option>
                    <span class="material-symbols-outlined"> face_3 </span>Matty
                    Mark
                </option>
                <option selected>
                    <span class="material-symbols-outlined"> face_6 </span
                    >Syndey Lyon
                </option>
            </select>
            <select class="my-custom-select">
                <button type="button">
                    <selectedcontent></selectedcontent>
                </button>
                <option>
                    <span class="material-symbols-outlined"> electric_car </span
                    >Electric Car
                </option>
                <option selected>
                    <span class="material-symbols-outlined"> motorcycle </span
                    >Motorcycle
                </option>
                <option>
                    <span class="material-symbols-outlined">
                        directions_boat </span
                    >Ferry
                </option>
                <option>
                    <span class="material-symbols-outlined">
                        directions_bus </span
                    >Bus
                </option>
            </select>
            <select class="my-custom-select">
                <button type="button">
                    <selectedcontent></selectedcontent>
                </button>
                <option>
                    <span class="material-symbols-outlined"> euro </span>Euro
                </option>
                <option>
                    <span class="material-symbols-outlined"> currency_yen </span
                    >Yen
                </option>
                <option selected>
                    <span class="material-symbols-outlined">
                        currency_lira </span
                    >Lira
                </option>
                <option>
                    <span class="material-symbols-outlined">
                        currency_pound </span
                    >Pound
                </option>
                <option>
                    <span class="material-symbols-outlined">
                        currency_ruble </span
                    >Ruble
                </option>
            </select>
            <select class="my-custom-select">
                <button type="button">
                    <selectedcontent></selectedcontent>
                </button>
                <optgroup>
                    <option>Candy</option>
                    <option disabled>Chocolate</option>
                    <option>Ice Cream</option>
                </optgroup>
                <optgroup>
                    <option>Bagels</option>
                    <option selected>Pastries</option>
                    <option>Cakes</option>
                </optgroup>
            </select>
            <select class="my-custom-select">
                <button type="button">
                    <selectedcontent></selectedcontent>
                </button>
                <optgroup>
                    <option>Arial</option>
                    <option>Roboto</option>
                    <option>Helvetica Neue</option>
                </optgroup>
                <optgroup>
                    <option>Spectral</option>
                    <option selected>Playfair Display</option>
                    <option>Times New Roman</option>
                </optgroup>
            </select>
            <select class="my-custom-select">
                <button type="button">
                    <selectedcontent></selectedcontent>
                </button>
                <option><span class="emoji">🍎</span>Apple</option>
                <option selected><span class="emoji">🥑</span>Avocado</option>
                <option><span class="emoji">🍋</span>Lemon</option>
                <option><span class="emoji">🍓</span>Straberry</option>
                <option><span class="emoji">🍉</span>Watermelon</option>
            </select>
            <select class="my-custom-select">
                <button type="button">
                    <selectedcontent></selectedcontent>
                </button>
                <option><span class="emoji">🍔</span></option>
                <option><span class="emoji">🍙</span></option>
                <option selected><span class="emoji">🌭</span></option>
                <option><span class="emoji">🥟</span></option>
                <option><span class="emoji">🍕</span></option>
            </select>
            <select class="my-custom-select">
                <button type="button">
                    <selectedcontent></selectedcontent>
                </button>
                <option selected>
                    <span class="dot green"></span>Available
                </option>
                <option><span class="dot red"></span>Do not disturb</option>
                <option><span class="dot gray"></span>Away</option>
            </select>
        </template>

        <main class="row">
            <!-- <div id="toc">
                <div class="title">&lt;select&gt;</div>
                <a href="#chrome">Chrome</a><br />
                <a href="#interoperable">Interoperable</a>
            </div> -->

            <div id="content" class="column flex">
                <div class="row group flex" id="chrome">
                    <div class="light flex">
                        <div class="caption">Chrome ⁄ Light</div>
                        <div class="demo"></div>
                    </div>
                    <div class="dark flex">
                        <div class="caption">Chrome ⁄ Dark</div>
                        <div class="demo"></div>
                    </div>
                </div>

                <div class="row group flex" id="interoperable">
                    <div class="light flex">
                        <div class="caption">Interoperable ⁄ Light</div>
                        <div class="demo"></div>
                    </div>
                    <div class="dark flex">
                        <div class="caption">Interoperable ⁄ Dark</div>
                        <div class="demo"></div>
                    </div>
                </div>
            </div>
        </main>

        <script src="script.js" type="module"></script>
    </body>
</html>
